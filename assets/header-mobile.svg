<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 210" width="390" height="210" role="img" aria-labelledby="t d">
  <title id="t">Eduardo, Software Engineer focused on AI systems and agentic AI</title>
  <desc id="d">Banner cycling through three lines: Software Engineer, AI Systems, Agentic AI; design, implement, test, evaluate; policy-controlled agents, auditable by design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#1a1d23"/></linearGradient>
    <style>
      .l{opacity:0;animation:cycle 12s infinite} .l1{opacity:1;animation-delay:0s} .l2{animation-delay:4s} .l3{animation-delay:8s}
      @keyframes cycle{0%{opacity:0}4%{opacity:1}30%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="390" height="210" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="389" height="209" rx="13.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>
  <rect x="24" y="30" width="44" height="4" rx="2" fill="#ff3b3b"/>
  <text x="24" y="86" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" fill="#f5f6f8" letter-spacing="-1">Eduardo</text>
  <text x="24" y="116" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#9aa1ab">Software Engineer · Backend · Full-Stack · AI Systems</text>
  <rect x="24" y="136" width="342" height="1" fill="#fff" fill-opacity="0.12"/>
  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6e8eb">
    <g class="l l1"><text x="24" y="170"><tspan fill="#ff3b3b">&gt;</tspan> Software Engineer | AI Systems | Agentic AI</text></g>
    <g class="l l2"><text x="24" y="170"><tspan fill="#ff3b3b">&gt;</tspan> design · implement · test · evaluate</text></g>
    <g class="l l3"><text x="24" y="170"><tspan fill="#ff3b3b">&gt;</tspan> policy-controlled agents, auditable by design</text></g>
  </g>
  <rect class="cursor" x="24" y="182" width="9" height="2.5" fill="#ff3b3b"/>
</svg>
